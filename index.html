<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFC Trade — Zafariddin Toshmurodov | Professional Trading</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #131722;
            --bg-card: #181d2a;
            --accent-green: #00d084;
            --accent-blue: #2962ff;
            --text-main: #f0f3fa;
            --text-muted: #868993;
            --border-color: #2a2e39;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Navbar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Base64 orqali o'rnatilgan logotip */
        .logo img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-green);
        }

        .logo span {
            color: var(--accent-green);
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #1e53e5;
            transform: translateY(-1px);
        }

        /* Ticker Tape */
        .ticker-wrapper {
            margin-top: 70px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        /* Hero Section */
        .hero {
            padding: 70px 5% 50px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .profile-avatar-container {
            margin-bottom: 20px;
        }

        .profile-avatar-container img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 208, 132, 0.3);
        }

        .founder-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .founder-title {
            color: var(--accent-green);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 208, 132, 0.12);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 208, 132, 0.25);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero h1 span {
            background: linear-gradient(90deg, #2962ff, #00d084);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 680px;
            margin: 0 auto 35px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
        }

        /* Live Chart Section */
        .chart-section {
            padding: 40px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .chart-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            height: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Features / Strategy */
        .features {
            padding: 80px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .section-title p {
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: rgba(41, 98, 255, 0.15);
            color: var(--accent-blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 18px;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Risk Calculator */
        .calc-section {
            padding: 60px 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .calc-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .calc-result {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0, 208, 132, 0.08);
            border: 1px solid rgba(0, 208, 132, 0.25);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 40px 5%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 60px;
        }

        .disclaimer {
            max-width: 800px;
            margin: 16px auto 0;
            font-size: 0.8rem;
            color: #636773;
        }

        @media (max-width: 768px) {
            nav { display: none; }
            .chart-container { height: 380px; }
        }
    </style>
</head>
